# LiteLLM model list for the Ollama models of this lab (mirrors the live proxy).
#
# NOT loaded by default. To use it, uncomment the `volumes` and `command` lines
# in docker-compose.yml, then `make litellm`. With STORE_MODEL_IN_DB=True the
# models stored in the DB are loaded too, so delete the DB copies first (UI or
# POST /model/delete) to avoid two deployments per model name.
#
# Ollama is reached by container name on the `lang` network.
# Pull the models with scripts/ollama_pull_model.sh.
#
# keep_alive overrides OLLAMA_KEEP_ALIVE for requests that come through the
# gateway. Big or rarely used models get short values to free VRAM
# (RTX 3060 12 GB + Tesla P4 8 GB).

model_list:
  # ---- Chat (reasoning models: keep max_tokens high, thinking counts against it)
  - model_name: gemma4:12b
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: http://ollama:11434
      num_ctx: 16384
      max_tokens: 8192
      keep_alive: 15m
      timeout: 300
      num_retries: 2
    model_info:
      mode: chat
      max_input_tokens: 16384
      max_output_tokens: 8192

  - model_name: qwen3-vl:8b
    litellm_params:
      model: ollama_chat/qwen3-vl:8b
      api_base: http://ollama:11434
      num_ctx: 16384
      max_tokens: 8192
      keep_alive: 3m
      timeout: 300
      num_retries: 2
    model_info:
      mode: chat
      max_input_tokens: 16384
      max_output_tokens: 8192

  - model_name: lfm2.5:8b
    litellm_params:
      model: ollama_chat/lfm2.5:8b
      api_base: http://ollama:11434
      num_ctx: 16384
      max_tokens: 8192
      keep_alive: 5m
      timeout: 300
      num_retries: 2
    model_info:
      mode: chat
      max_input_tokens: 16384
      max_output_tokens: 8192

  - model_name: llama3.2:3b
    litellm_params:
      model: ollama_chat/llama3.2:3b
      api_base: http://ollama:11434
      num_ctx: 16384
      max_tokens: 4096
      keep_alive: 5m
      timeout: 300
      num_retries: 2
    model_info:
      mode: chat
      max_input_tokens: 16384
      max_output_tokens: 4096

  # ---- Embeddings (ollama/ prefix, not ollama_chat/)
  - model_name: qwen3-embedding:8b
    litellm_params:
      model: ollama/qwen3-embedding:8b
      api_base: http://ollama:11434
      keep_alive: 5m
      timeout: 120
      num_retries: 2
    model_info:
      mode: embedding
      max_input_tokens: 8192
      output_vector_size: 4096

  # Prefix the text with "search_query: " or "search_document: " (done by the client)
  - model_name: nomic-embed-text-v2-moe:latest
    litellm_params:
      model: ollama/nomic-embed-text-v2-moe:latest
      api_base: http://ollama:11434
      keep_alive: 10m
      timeout: 120
      num_retries: 2
    model_info:
      mode: embedding
      max_input_tokens: 512
      output_vector_size: 768

  - model_name: embeddinggemma:300m
    litellm_params:
      model: ollama/embeddinggemma:300m
      api_base: http://ollama:11434
      keep_alive: 10m
      timeout: 120
      num_retries: 2
    model_info:
      mode: embedding
      max_input_tokens: 2048
      output_vector_size: 768

  # ---- Decision models (classifiers). Call POST /v1/systemone, not chat.
  # Provider `typesafe/` speaks the same System One API that Ollama serves.
  # The api_key is a dummy: Ollama needs none, LiteLLM requires a value.
  - model_name: tev1:4b            # ~2K token context, short inputs
    litellm_params:
      model: typesafe/tev1:4b
      api_base: http://ollama:11434
      api_key: ollama
      keep_alive: 15m
      timeout: 120
      num_retries: 2
    model_info:
      mode: decisions

  - model_name: nimble:9b          # 8K token context, rarely used: short keep_alive
    litellm_params:
      model: typesafe/nimble:9b
      api_base: http://ollama:11434
      api_key: ollama
      keep_alive: 2m
      timeout: 120
      num_retries: 2
    model_info:
      mode: decisions
