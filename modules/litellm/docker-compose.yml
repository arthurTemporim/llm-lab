services:
  # One-shot: writes config.yaml from the Ollama models and models.yaml, then exits.
  # Runs again at every `up` (`make litellm`), so newly pulled models are picked up.
  litellm-init:
    image: ghcr.io/berriai/litellm:v1.106.4
    container_name: litellm-init
    restart: "no"
    env_file: .env
    entrypoint: ["python3", "/opt/llm-lab/generate_config.py"]
    volumes:
      - ./generate_config.py:/opt/llm-lab/generate_config.py:ro
      - ./models.yaml:/opt/llm-lab/models.yaml:ro
      - litellm-config:/config
    networks:
      - lang

  litellm:
    image: ghcr.io/berriai/litellm:v1.106.4
    container_name: litellm
    restart: unless-stopped
    env_file: .env
    depends_on:
      litellm-init:
        condition: service_completed_successfully
    volumes:
      - litellm-config:/config:ro
    command: ["--port", "4000", "--config", "/config/config.yaml"]
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 http://localhost:4000/health/liveliness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - lang

  litellm-prometheus:
    image: prom/prometheus:v3.15.0
    container_name: litellm-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "${LITELLM_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - litellm-prometheus-data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - lang

volumes:
  # name: keeps the docker volumes created before the rename (no data loss)
  litellm-config:
    name: litellm_litellm_config
  litellm-prometheus-data:
    name: litellm_prometheus_data

networks:
  lang:
    external: true
