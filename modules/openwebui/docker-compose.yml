services:
  openwebui:
    # CPU image. docker-compose.gpu.yml swaps it for the CUDA one.
    image: ghcr.io/open-webui/open-webui:v0.11.4
    container_name: openwebui
    restart: unless-stopped
    env_file: .env
    ports:
      - "${OPENWEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui:/app/backend/data
    networks:
      - lang

volumes:
  open-webui:

networks:
  lang:
    external: true
