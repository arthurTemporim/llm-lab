# NVIDIA GPU override, added automatically by the Makefile when a GPU runtime is found
# (GPU=1 forces it, GPU=0 disables it).
services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.11.4-cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
