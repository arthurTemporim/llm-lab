# Shared services: Postgres (pgvector), Redis and MinIO. Creates the "lang" network.
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Must be PGDATA (/var/lib/postgresql/data), otherwise data is lost on `down`
      - postgres:/var/lib/postgresql/data
    networks:
      - lang

  redis:
    image: redis:8.6.7-alpine
    container_name: redis
    restart: unless-stopped
    # noeviction is required by Langfuse (BullMQ queues must never be evicted)
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lang

  minio:
    # MinIO no longer publishes images on Docker Hub. Chainguard only publishes
    # "latest" for the free tier, so this is the one unpinned image.
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    restart: unless-stopped
    env_file: .env
    entrypoint: sh
    # Buckets are plain directories under /data, so creating them is enough.
    command:
      - -c
      - 'for b in $${MINIO_BUCKETS}; do mkdir -p "/data/$$b"; done && minio server --address ":9000" --console-address ":9001" /data'
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - lang

volumes:
  redis-data:
  minio-data:
  postgres:

networks:
  lang:
    name: lang
