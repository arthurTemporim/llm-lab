services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lang
      POSTGRES_PASSWORD: lang
      POSTGRES_DB: langflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lang -d langflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/vector_data
      - ./init/pgvector.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lang

  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    # noeviction is required by Langfuse (BullMQ queues must never be evicted)
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lang

  minio:
    # MinIO no longer publishes images on Docker Hub; Chainguard's build is
    # the one used by the official Langfuse compose file.
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    restart: unless-stopped
    entrypoint: sh
    # Buckets are plain directories under /data, so creating them is enough.
    command:
      - -c
      - 'for b in $${MINIO_BUCKETS}; do mkdir -p "/data/$$b"; done && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniosecret}
      MINIO_BUCKETS: ${MINIO_BUCKETS:-langfuse}
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - lang

volumes:
  redis-data:
  minio-data:
  postgres:

networks:
  lang:
    name: lang
