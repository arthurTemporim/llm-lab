# Shared services: Postgres (pgvector), Redis and Garage (S3). Creates the "lang" network.
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Must be PGDATA (/var/lib/postgresql/data), otherwise data is lost on `down`
      - postgres-data:/var/lib/postgresql/data
    networks:
      - lang

  redis:
    image: redis:8.6.7-alpine
    container_name: redis
    restart: unless-stopped
    # noeviction is required by Langfuse (BullMQ queues must never be evicted)
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lang

  garage:
    image: dxflrs/garage:v2.5.0
    container_name: garage
    restart: unless-stopped
    env_file: .env
    # Single node, no replication. Creates the GARAGE_DEFAULT_* key and bucket if missing.
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    ports:
      - "${GARAGE_S3_PORT:-9100}:3900"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    # The image has no shell, so the garage CLI is the check
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - lang

volumes:
  redis-data:
  garage-data:
  # name: keeps the docker volume created before the rename (no data loss)
  postgres-data:
    name: common-services_postgres

networks:
  lang:
    name: lang
