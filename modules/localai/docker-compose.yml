services:
  localai:
    # CPU image. docker-compose.gpu.yml swaps it for the NVIDIA one.
    image: localai/localai:v3.12.1-aio-cpu
    container_name: localai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 1m
      timeout: 10m
      retries: 5
    ports:
      - "${LOCALAI_PORT:-8080}:8080"
    env_file: .env
    environment:
      - DEBUG=true
      - LOCALAI_BACKEND_ASSETS_PATH=/backends
    volumes:
      - ./models:/models:cached
      - ./backends:/backends
    networks:
      - lang

networks:
  lang:
    external: true
