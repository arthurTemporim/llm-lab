services:
  ollama:
    image: ollama/ollama:0.40.0
    container_name: ollama
    restart: unless-stopped
    env_file: .env
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama
    networks:
      - lang

volumes:
  ollama:

networks:
  lang:
    external: true
