services:
  langflow:
    build: .
    container_name: langflow
    restart: unless-stopped
    ports:
      - "${LANGFLOW_PORT:-7860}:7860"
    env_file: .env
    volumes:
      - langflow-data:/app/langflow
    networks:
      - lang

volumes:
  langflow-data:

networks:
  lang:
    external: true

